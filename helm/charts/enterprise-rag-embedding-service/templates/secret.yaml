{{- if .Values.enabled }}
# to be implemented by an enterprise vault
apiVersion: v1
kind: Secret
metadata:
  name: enterprise-rag-embedding-service
type: Opaque
stringData:
  S3_ACCESS_KEY: {{ .Values.secret.s3AccessKey | quote }}
  S3_SECRET_KEY: {{ .Values.secret.s3SecretKey | quote }}
{{- end }}
