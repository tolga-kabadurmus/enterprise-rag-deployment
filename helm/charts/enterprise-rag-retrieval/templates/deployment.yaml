{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-rag-retrieval
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: enterprise-rag-retrieval
  template:
    metadata:
      labels:
        app: enterprise-rag-retrieval
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: enterprise-rag-retrieval
      containers:
        - name: enterprise-rag-retrieval
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.configmap.query_api_port }}
          envFrom:
            - configMapRef:
                name: enterprise-rag-retrieval
{{- if or .Values.secret.create .Values.secret.existingSecret }}
            - secretRef:
                name: {{ include "enterprise-rag-retrieval.secretName" . }}
{{- end }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
{{ toYaml .Values.resources | nindent 12 }}
{{- end }}
