# values to be filled by an enterprise vault
apiVersion: v1
kind: Secret
metadata:
  name: enterprise-rag-indexing
type: Opaque
stringData:
  S3_ACCESS_KEY: {{ .Values.secret.s3AccessKey | quote }}
  S3_SECRET_KEY: {{ .Values.secret.s3SecretKey | quote }}
  QDRANT_API_KEY: {{ .Values.secret.qdrantApiKey | quote }}
